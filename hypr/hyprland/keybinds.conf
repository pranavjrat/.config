exec = hyprctl dispatch submap global
submap = global

# ## Shell keybinds
# Launcher
bindi = Alt, Super_L, global, caelestia:launcher
bindin = Alt, catchall, global, caelestia:launcherInterrupt
bindin = Alt, mouse:272, global, caelestia:launcherInterrupt
bindin = Alt, mouse:273, global, caelestia:launcherInterrupt
bindin = Alt, mouse:274, global, caelestia:launcherInterrupt
bindin = Alt, mouse:275, global, caelestia:launcherInterrupt
bindin = Alt, mouse:276, global, caelestia:launcherInterrupt
bindin = Alt, mouse:277, global, caelestia:launcherInterrupt
bindin = Alt, mouse_up, global, caelestia:launcherInterrupt
bindin = Alt, mouse_down, global, caelestia:launcherInterrupt

# Misc
bind = Super+Alt, F4, global, caelestia:session
bindl = Ctrl+Super, C, global, caelestia:clearNotifs
bind = Super, L, global, caelestia:lock

# Restore lock
bindl = Alt+Super, L, exec, caelestia shell -d
bindl = Alt+Super, L, global, caelestia:lock

# Brightness
bindl = , XF86MonBrightnessUp, global, caelestia:brightnessUp
bindl = , XF86MonBrightnessDown, global, caelestia:brightnessDown

# Media
bindl = Ctrl+Alt, Space, global, caelestia:mediaToggle
bindl = , XF86AudioPlay, global, caelestia:mediaToggle
bindl = , XF86AudioPause, global, caelestia:mediaToggle
bindl = Ctrl+Alt, Equal, global, caelestia:mediaNext
bindl = , XF86AudioNext, global, caelestia:mediaNext
bindl = Ctrl+Alt, Minus, global, caelestia:mediaPrev
bindl = , XF86AudioPrev, global, caelestia:mediaPrev
bindl = , XF86AudioStop, global, caelestia:mediaStop

# Kill/restart
bindr = Ctrl+Alt+Shift, R, exec, qs -c caelestia kill
bindr = Alt+Shift, R, exec, qs -c caelestia kill; caelestia shell -d

# Go to workspace #
$wsaction = ~/.config/hypr/scripts/wsaction.fish
bind = Alt, 1, exec, $wsaction workspace 1
bind = Alt, 2, exec, $wsaction workspace 2
bind = Alt, 3, exec, $wsaction workspace 3
bind = Alt, 4, exec, $wsaction workspace 4
bind = Alt, 5, exec, $wsaction workspace 5
bind = Alt, 6, exec, $wsaction workspace 6
bind = Alt, 7, exec, $wsaction workspace 7
bind = Alt, 8, exec, $wsaction workspace 8
bind = Alt, 9, exec, $wsaction workspace 9
bind = Alt, 0, exec, $wsaction workspace 10
# Go to workspace group #
bind = Ctrl+Alt, 1, exec, $wsaction -g workspace 1
bind = Ctrl+Alt, 2, exec, $wsaction -g workspace 2
bind = Ctrl+Alt, 3, exec, $wsaction -g workspace 3
bind = Ctrl+Alt, 4, exec, $wsaction -g workspace 4
bind = Ctrl+Alt, 5, exec, $wsaction -g workspace 5
bind = Ctrl+Alt, 6, exec, $wsaction -g workspace 6
bind = Ctrl+Alt, 7, exec, $wsaction -g workspace 7
bind = Ctrl+Alt, 8, exec, $wsaction -g workspace 8
bind = Ctrl+Alt, 9, exec, $wsaction -g workspace 9
bind = Ctrl+Alt, 0, exec, $wsaction -g workspace 10
# Go to workspace -1/+1
bind = Alt, mouse_down, workspace, -1
bind = Alt, mouse_up, workspace, +1
binde = Ctrl+Alt, left, workspace, -1
binde = Alt, Page_Up, workspace, -1
binde = Ctrl+Alt, right, workspace, +1
binde = Alt, Page_Down, workspace, +1
# Go to workspace group -1/+1
bind = Ctrl+Alt, mouse_down, workspace, -10
bind = Ctrl+Alt, mouse_up, workspace, +10
# Toggle special workspace
bind = Alt, S, exec, caelestia toggle specialws

# Move window to workspace #
bind = Alt+Shift, 1, exec, $wsaction movetoworkspace 1
bind = Alt+Shift, 2, exec, $wsaction movetoworkspace 2
bind = Alt+Shift, 3, exec, $wsaction movetoworkspace 3
bind = Alt+Shift, 4, exec, $wsaction movetoworkspace 4
bind = Alt+Shift, 5, exec, $wsaction movetoworkspace 5
bind = Alt+Shift, 6, exec, $wsaction movetoworkspace 6
bind = Alt+Shift, 7, exec, $wsaction movetoworkspace 7
bind = Alt+Shift, 8, exec, $wsaction movetoworkspace 8
bind = Alt+Shift, 9, exec, $wsaction movetoworkspace 9
bind = Alt+Shift, 0, exec, $wsaction movetoworkspace 10
# Move window to workspace group #
bind = Ctrl+Alt+Super, 1, exec, $wsaction -g movetoworkspace 1
bind = Ctrl+Alt+Super, 2, exec, $wsaction -g movetoworkspace 2
bind = Ctrl+Alt+Super, 3, exec, $wsaction -g movetoworkspace 3
bind = Ctrl+Alt+Super, 4, exec, $wsaction -g movetoworkspace 4
bind = Ctrl+Alt+Super, 5, exec, $wsaction -g movetoworkspace 5
bind = Ctrl+Alt+Super, 6, exec, $wsaction -g movetoworkspace 6
bind = Ctrl+Alt+Super, 7, exec, $wsaction -g movetoworkspace 7
bind = Ctrl+Alt+Super, 8, exec, $wsaction -g movetoworkspace 8
bind = Ctrl+Alt+Super, 9, exec, $wsaction -g movetoworkspace 9
bind = Ctrl+Alt+Super, 0, exec, $wsaction -g movetoworkspace 10
# Move window to workspace -1/+1
binde = Alt+Super, Page_Up, movetoworkspace, -1
binde = Alt+Super, Page_Down, movetoworkspace, +1
bind = Alt+Super, mouse_down, movetoworkspace, -1
bind = Alt+Super, mouse_up, movetoworkspace, +1
binde = Ctrl+Alt+Shift, right, movetoworkspace, +1
binde = Ctrl+Alt+Shift, left, movetoworkspace, -1
# Move window to/from special workspace
bind = Ctrl+Alt+Shift, up, movetoworkspace, special:special
bind = Ctrl+Alt+Shift, down, movetoworkspace, e+0
bind = Alt+Super, S, movetoworkspace, special:special

# Window groups
binde = Alt, Tab, cyclenext, activewindow
bind = Alt, grave, workspace, back_and_forth
binde = Alt, W, changegroupactive, f
bind = Alt, Comma, togglegroup
bind = Alt+Shift, Comma, lockactivegroup, toggle

# Window actions
bind = Alt, h, movefocus, l
bind = Alt, l, movefocus, r
bind = Alt, k, movefocus, u
bind = Alt, j, movefocus, d
bind = Alt+Shift, left, movewindow, l
bind = Alt+Shift, right, movewindow, r
bind = Alt+Shift, up, movewindow, u
bind = Alt+Shift, down, movewindow, d
binde = Alt, Minus, splitratio, -0.1
binde = Alt, Equal, splitratio, 0.1
bindm = Alt, mouse:272, movewindow
bindm = Alt, Z, movewindow
bindm = Alt, mouse:273, resizewindow
bindm = Alt, X, resizewindow
bind = Ctrl+Alt, Backslash, centerwindow, 1
bind = Ctrl+Alt+Super, Backslash, resizeactive, exact 55% 70%
bind = Ctrl+Alt+Super, Backslash, centerwindow, 1
bind = Alt+Super, Backslash, exec, caelestia pip  # Move window to picture-in-picture mode
bind = Alt, P, pin
bind = Alt, F, fullscreen, 0
bind = Alt+Super, F, fullscreen, 1  # Fullscreen with borders
bind = Alt, Space, togglefloating,
bind = Alt+Shift, Q, killactive,

# Special workspace toggles
bind = Ctrl+Shift, Escape, exec, caelestia toggle sysmon
bind = Alt, M, exec, caelestia toggle music
#bind = Alt, D, exec, caelestia toggle communication
bind = Alt, N, exec, caelestia toggle obsidian
# Apps
bind = Alt, Return, exec, app2unit -- foot
bind = Alt, B, exec, app2unit -- zen-browser
bind = Ctrl+Alt, V, exec, app2unit -- pavucontrol

# Utilities
bindl = , Print, exec, caelestia screenshot  # Full screen capture > clipboard
bind = Alt+Shift, S, global, caelestia:screenshotFreeze  # Capture region (freeze)
bind = Alt+Shift+Super, S, global, caelestia:screenshot  # Capture region
bind = Alt+Super, R, exec, caelestia record -s  # Record screen with sound
bind = Ctrl+Super, R, exec, caelestia record  # Record screen
bind = Alt+Shift+Super, R, exec, caelestia record -r  # Record region
bind = Alt+Shift, C, exec, hyprpicker -a  # Colour picker

# Volume
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = Alt+Shift, M, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindle = , XF86AudioRaiseVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 10%+
bindle = , XF86AudioLowerVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%-

# Sleep
bind = Alt+Shift, L, exec, systemctl suspend-then-hibernate

# Clipboard and emoji picker
bind = Alt, C, exec, pkill fuzzel || caelestia clipboard
bind = Alt+Super, C, exec, pkill fuzzel || caelestia clipboard -d
bind = Alt, V, exec, pkill fuzzel || caelestia emoji -p
bindl = Ctrl+Shift+Super, V, exec, sleep 0.5s && ydotool type -d 1 "$(cliphist list | head -1 | cliphist decode)"  # Alternate paste


# Testing
bindl = Alt+Super, f12, exec, notify-send -u low -i dialog-information-symbolic 'Test notification' "Here's a really long message to test truncation and wrapping\nYou can middle click or flick this notification to dismiss it!" -a 'Shell' -A "Test1=I got it!" -A "Test2=Another action"

bind = Alt, D, exec, rofi -show combi


#sf

# PulseAudio configuration for PipeWire
# Optimized for Intel Tiger Lake audio

pulse.properties = {
    # Server configuration
    pulse.min.req = 256/48000
    pulse.default.req = 1024/48000
    pulse.max.req = 2048/48000
    pulse.min.quantum = 256/48000
    pulse.max.quantum = 2048/48000
    
    # Latency and performance settings
    pulse.min.frag = 256/48000
    pulse.default.frag = 1024/48000
    pulse.max.frag = 2048/48000
    
    # Memory settings
    pulse.default.tlength = 1024/48000
    pulse.min.tlength = 256/48000
    pulse.max.tlength = 2048/48000
    
    # Buffer settings to prevent stuttering
    pulse.default.prebuf = 1024/48000
    pulse.default.maxlength = 4096/48000
}

pulse.rules = [
    {
        matches = [
            { application.name = "~firefox.*" }
            { application.name = "~chromium.*" }
            { application.name = "~brave.*" }
        ]
        actions = {
            update-props = {
                pulse.min.req = 512/48000
                pulse.default.req = 1024/48000
                pulse.max.req = 2048/48000
                session.suspend-timeout-seconds = 0
            }
        }
    }
]

stream.properties = {
    resample.quality = 10
    channelmix.normalize = false
    channelmix.mix-lfe = true
    audio.channels = 2
    audio.format = "S32LE"
    audio.rate = 48000
}
